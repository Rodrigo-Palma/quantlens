repos:
  # ruff runs from the locked environment, so the hook and CI use the same
  # version (uv.lock) and Dependabot's pip updates cover both.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
